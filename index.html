<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Roast Cafe</title>

 <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="phone">

        <header>
            <p class="delivery-label">📍 DELIVER TO</p>

            <div class="address">
                <select aria-label="Delivery address">
                    <option>Campus Dorms, Bldg B (ID: 19002991)</option>
                </select>
            </div>

            <div class="search-box">
                <span aria-hidden="true">🔍</span>
                <input
                    type="search"
                    aria-label="Search Daily Roast Cafe"
                    placeholder="Search restaurants, groceries in Daily Roast Cafe..."
                >
            </div>
        </header>

        <main>
            <section class="promo" aria-label="Special offer">
                <h1>Afternoon Sweet Treat Deal</h1>
                <p>Handcrafted pour-over coffee</p>
                <span class="coupon">🏷️ CODE: ICA-2991</span>
            </section>

            <section aria-labelledby="categories-title">
                <h2 id="categories-title">Explore Categories</h2>

                <div class="categories">
                    <div class="category">
                        <span class="category-icon">☕</span>
                        <span class="category-name">Espresso</span>
                    </div>

                    <div class="category">
                        <span class="category-icon">🥐</span>
                        <span class="category-name">Pastries</span>
                    </div>

                    <div class="category">
                        <span class="category-icon">🥪</span>
                        <span class="category-name">Sandwiches</span>
                    </div>

                    <div class="category">
                        <span class="category-icon">🧋</span>
                        <span class="category-name">Cold Brew</span>
                    </div>
                </div>
            </section>

            <section aria-labelledby="featured-title">
                <h2 class="featured-heading" id="featured-title">
                    Featured Store
                </h2>

                <article class="store-card">
                    <div class="store-cover" aria-hidden="true">🏬</div>

                    <div class="store-details">
                        <div class="store-title-row">
                            <h3>The Parisian Bakery</h3>
                            <span class="rating">★ 4.9</span>
                        </div>

                        <p class="store-description">
                            French Pastries • Breads
                        </p>

                        <p class="delivery-details">
                            🕒 20-30 min • EGP 45
                        </p>
                    </div>
                </article>
            </section>
        </main>

        <p class="version">v1.4.2 (build 2991)</p>

        <nav class="bottom-nav" aria-label="Main navigation">
            <button type="button" class="nav-item active" aria-current="page">
                <span class="nav-icon">🏠</span>
                Home
            </button>

            <button type="button" class="nav-item">
                <span class="nav-icon">🔍</span>
                Search
            </button>

            <button type="button" class="nav-item">
                <span class="nav-icon">📋</span>
                Orders
            </button>

            <button type="button" class="nav-item">
                <span class="nav-icon">👤</span>
                Profile
            </button>
        </nav>

    </div>
</body>
</html>
